# Build versioned WinUI artifacts on manual runs. A matching v* tag additionally
# creates a GitHub Release. The WPF ZIP remains available as a rollback artifact.
name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/TinyTools.WinUI/TinyTools.WinUI.csproj" -Raw -Encoding UTF8
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid WinUI project version: $version"
          }
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVersion = "${{ github.ref_name }}".TrimStart('v', 'V')
            if ($tagVersion -ne $version) {
              throw "Tag version $tagVersion does not match project version $version"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building TinyTools v$version"

      - name: Test
        run: dotnet test tests/TinyTools.Tests/TinyTools.Tests.csproj -c Release

      - name: Publish WinUI app
        run: |
          dotnet publish src/TinyTools.WinUI/TinyTools.WinUI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishProfile=win-x64 `
            -o winui-preview
          Get-ChildItem winui-preview -Filter "*.pdb" -File -ErrorAction SilentlyContinue | Remove-Item -Force

      - name: Package verified WinUI update
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "TinyTools-WinUI-v$version-win-x64.zip"
          Compress-Archive -Path winui-preview\* -DestinationPath $zipName
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content "$zipName.sha256" -Encoding utf8NoBOM -NoNewline
          Write-Host "Created $zipName and SHA-256 checksum"

      - name: Publish WPF fallback (self-contained, single-file)
        run: |
          dotnet publish src/TinyTools/TinyTools.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableWindowsTargeting=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o wpf-fallback

      - name: Package WPF fallback
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "TinyTools-WPF-v$version-win-x64.zip"
          Compress-Archive -Path wpf-fallback\* -DestinationPath $zipName
          Write-Host "Created $zipName"

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe"
          $expectedHash = "5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.0.2-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "InnoSetup"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup SHA-256 mismatch: $actualHash"
          }
          Start-Process -FilePath $installer -Wait -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installDir"
          )
          if (-not (Test-Path (Join-Path $installDir "ISCC.exe"))) {
            throw "ISCC.exe was not installed."
          }

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          ./installer/build-installer.ps1 `
            -Version $version `
            -PublishDir "$PWD/winui-preview" `
            -OutputDir "$PWD/installer-output" `
            -IsccPath "$env:RUNNER_TEMP/InnoSetup/ISCC.exe" `
            -ArtifactPrefix "TinyTools-WinUI" `
            -AppExeName "TinyTools.WinUI.exe" `
            -AppMutex "Local\TinyTools_WinUI_SingleInstance"

      - name: Checksum installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = "installer-output/TinyTools-WinUI-v$version-win-x64-Setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installer -Leaf)" |
            Set-Content "$installer.sha256" -Encoding utf8NoBOM -NoNewline

      - name: Upload WinUI release artifact
        uses: actions/upload-artifact@v7
        with:
          name: TinyTools-WinUI-v${{ steps.version.outputs.version }}-win-x64
          path: |
            TinyTools-WinUI-v*-win-x64.zip
            TinyTools-WinUI-v*-win-x64.zip.sha256
            installer-output/TinyTools-WinUI-v*-win-x64-Setup.exe
            installer-output/TinyTools-WinUI-v*-win-x64-Setup.exe.sha256
          if-no-files-found: error

      - name: Upload WPF fallback artifact
        uses: actions/upload-artifact@v7
        with:
          name: TinyTools-WPF-v${{ steps.version.outputs.version }}-win-x64
          path: TinyTools-WPF-v*-win-x64.zip
          if-no-files-found: error

      - name: Upload unpacked WinUI build
        uses: actions/upload-artifact@v7
        with:
          name: TinyTools-WinUI-v${{ steps.version.outputs.version }}-unpacked-win-x64
          path: winui-preview/**
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            TinyTools-WinUI-v*-win-x64.zip
            TinyTools-WinUI-v*-win-x64.zip.sha256
            installer-output/TinyTools-WinUI-v*-win-x64-Setup.exe
            installer-output/TinyTools-WinUI-v*-win-x64-Setup.exe.sha256
            TinyTools-WPF-v*-win-x64.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
